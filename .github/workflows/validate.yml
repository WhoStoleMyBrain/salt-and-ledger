name: Validate foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    # Normal v3 reports add measured replay time; exhaustive sweeps remain opt-in.
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install documentation dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate canonical definitions
        run: python tools/validate_data.py
      - name: Test data and documentation pipeline
        run: python -m unittest discover -s tests/python -v
      - name: Check generated reference freshness
        run: python tools/generate_docs.py --check
      - name: Build documentation strictly
        run: python -m mkdocs build --strict
      - name: Restore standalone projects
        run: dotnet restore SaltAndLedger.sln --locked-mode
      - name: Compile standalone foundation
        run: dotnet build SaltAndLedger.sln --configuration Release --no-restore
      - name: Test simulation
        run: dotnet test SaltAndLedger.sln --configuration Release --no-build
      - name: Run data-to-simulation demonstration
        run: dotnet run --project samples/SaltAndLedger.Demo --configuration Release --no-build -- data/content.json
      - name: Run deterministic world demonstration
        run: dotnet run --project samples/SaltAndLedger.Demo --configuration Release --no-build -- data/content.json --world
      - name: Run finite market demonstration
        # The market demo also asserts repeatability and its documented final state.
        run: dotnet run --project samples/SaltAndLedger.Demo --configuration Release --no-build -- data/content.json --market
      - name: Verify pricing experiments and report freshness
        run: dotnet run --project samples/SaltAndLedger.Demo --configuration Release --no-build -- data/content.json --pricing --check
      - name: Run manual shipping comparison
        # Checks measured balances, empty final cargo, repeatability, and reversed port setup.
        run: dotnet run --project samples/SaltAndLedger.Demo --configuration Release --no-build -- data/content.json --shipping
      - name: Run configurable route automation comparison
        # Checks marginal limits, bounded waiting, determinism, and manual-equivalent states.
        run: dotnet run --project samples/SaltAndLedger.Demo --configuration Release --no-build -- data/content.json --automation
      - name: Verify living archipelago experiments and report freshness
        # Sixty-day strategies reconcile physical flows and cash; repeat, reversed setup, and culture must match.
        run: dotnet run --project samples/SaltAndLedger.Demo --configuration Release --no-build -- data/content.json --archipelago --check
      - name: Verify enterprise experiments and report freshness
        # Ninety-day industry strategies plus deadline-bound challenge trials; exact cash/physical reconciliation.
        run: dotnet run --project samples/SaltAndLedger.Demo --configuration Release --no-build -- data/content.json --enterprise --check
      - name: Verify industrial logistics and manual equivalence
        run: dotnet run --project samples/SaltAndLedger.Demo --configuration Release --no-build -- data/content.json --industrial-logistics --check
      - name: Verify complete runs, charters and financial reconciliation
        run: dotnet run --project samples/SaltAndLedger.Demo --configuration Release --no-build -- data/content.json --runs --check
      - name: Verify seeded worlds and both ascensions
        # Stable 25-seed sample plus Classic; deeper 125-seed sweeps remain opt-in.
        run: dotnet run --project samples/SaltAndLedger.Demo --configuration Release --no-build -- data/content.json --seeded-runs --check
      - name: Verify living-city accounts and long-horizon report
        # Three v2 seeds, pricing A/B, both ascensions, 365-day strategies and finite diagnostic worlds.
        run: dotnet run --project samples/SaltAndLedger.Demo --configuration Release --no-build -- data/content.json --living-cities --check
      - name: Verify expanding economy and exact continuation
        # The full v3 seed/policy/development matrix is bounded; deep sweeps remain opt-in.
        run: dotnet run --project samples/SaltAndLedger.Demo --configuration Release --no-build -- data/content.json --expanding-economy --check
      - name: Verify monetary reinvestment experiment
        run: dotnet run --project samples/SaltAndLedger.Demo --configuration Release --no-build -- data/content.json --expanding-economy --reinvestment --check
      - name: Prepare Unity integration assets
        run: python tools/prepare_unity.py
      - name: Check Unity integration asset freshness
        run: python tools/prepare_unity.py --check

  economic-circulation:
    runs-on: ubuntu-latest
    # Separate from the 20-minute historical gate: fixed 80-world matrix, no deep sweep.
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore locked standalone dependencies
        run: dotnet restore SaltAndLedger.sln --locked-mode
      - name: Build circulation report runner
        run: dotnet build samples/SaltAndLedger.Demo/SaltAndLedger.Demo.csproj --configuration Release --no-restore
      - name: Verify measured circulation report
        run: dotnet run --project samples/SaltAndLedger.Demo --configuration Release --no-build -- data/content.json --economic-circulation --check
