site_name: Salt & Ledger
site_description: A player's guide, offline encyclopedia reference, and development notes for the maritime economic strategy game.
site_url: !ENV [SALT_LEDGER_SITE_URL, ""]
docs_dir: docs
site_dir: site
theme:
  name: mkdocs
  navigation_depth: 2
  highlightjs: false
extra_css:
  - stylesheets/maritime.css
plugins:
  - search
nav:
  - Welcome: index.md
  - Player guide:
      - Getting started: PLAYER_GUIDE.md
      - Grand Commission: GRAND_COMMISSION.md
      - Harbor and stock: HARBOR.md
      - Cargo itineraries: AUTOMATION.md
      - Production and money: EXPANDING_ECONOMY.md
      - Households and welfare: LIVING_CITIES.md
      - Local saves: SAVES.md
  - Game reference:
      - Encyclopedia: reference/index.md
      - Production chains: reference/chains.md
      - Commodities: reference/catalog-goods.md
      - Buildings: reference/catalog-buildings.md
      - Recipes: reference/catalog-recipes.md
      - Mechanics: reference/catalog-mechanics.md
  - Development:
      - Architecture: ARCHITECTURE.md
      - Exact mechanics: MECHANICS.md
      - Game design: GAME_DESIGN.md
      - Measured circulation: ECONOMIC_CIRCULATION_REVIEW.md
      - Current experiments: EXPANDING_ECONOMY_EXPERIMENTS.md
      - Unity setup: UNITY.md
      - Playtest checklist: PLAYTEST.md
      - UI design system: UI_DESIGN_SYSTEM.md
      - Cleanup verification: REPOSITORY-CLEANUP.md
      - Roadmap: ROADMAP.md
      - Website: WEBSITE.md
validation:
  nav:
    omitted_files: ignore
    not_found: warn
  links:
    not_found: warn
    anchors: warn
